<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訪問美容 カット予約</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: linear-gradient(160deg, #fdf6f0 0%, #fce8e8 50%, #f0eafb 100%);
      min-height: 100vh;
    }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DAYS_JA = ["日","月","火","水","木","金","土"];
    const MONTHS_JA = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

    // ▼ ここを実際の電話番号に変更してください
    const STYLIST_PHONE = "090-8052-9511";
    // ▼ 施術者ログインパスワード
    const STYLIST_PASSWORD = "1234";

    // ── カットメニュー（1種類） ──────────────────────────
    const MENU = { id: "cut", name: "カット（訪問）", duration: "60分", price: "2,000円" };

    // ── 時間スロット生成（28日分・日曜除く） ────────────────
    function generateSlots() {
      const slots = {};
      const today = new Date();
      for (let d = 0; d < 28; d++) {
        const date = new Date(today);
        date.setDate(today.getDate() + d);
        if (date.getDay() === 0) continue; // 日曜休み
        const ds = date.toISOString().split("T")[0];
        slots[ds] = [
          { time: "10:00", status: "open", clientName: "", clientPhone: "", clientNote: "", address: "" },
          { time: "11:30", status: "open", clientName: "", clientPhone: "", clientNote: "", address: "" },
          { time: "13:30", status: "open", clientName: "", clientPhone: "", clientNote: "", address: "" },
          { time: "15:00", status: "open", clientName: "", clientPhone: "", clientNote: "", address: "" },
          { time: "16:30", status: "open", clientName: "", clientPhone: "", clientNote: "", address: "" },
        ];
      }
      // サンプル予約データ
      const keys = Object.keys(slots);
      if (keys[1]) slots[keys[1]][1] = { time: "11:30", status: "booked", clientName: "山田 花子", clientPhone: "090-1234-5678", clientNote: "毛量多め", address: "○○市△△町1-2-3" };
      if (keys[3]) slots[keys[3]][3] = { time: "15:00", status: "booked", clientName: "鈴木 一郎", clientPhone: "080-9876-5432", clientNote: "", address: "○○市□□町4-5-6" };
      return slots;
    }

    function formatDate(str) {
      if (!str) return "";
      const d = new Date(str);
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DAYS_JA[d.getDay()]}）`;
    }

    function sendSMSToStylist(date, time, clientName, clientPhone, address, note) {
      const msg = `【訪問カット予約】\n${formatDate(date)} ${time}\nお客様：${clientName}\nTEL：${clientPhone}\n住所：${address}${note ? `\n備考：${note}` : ""}`;
      const phone = STYLIST_PHONE.replace(/-/g, "");
      window.location.href = `sms:${phone}?body=${encodeURIComponent(msg)}`;
    }

    // ── カレンダーコンポーネント ─────────────────────────
    function Calendar({ calDays, calMonth, setCalMonth, selectedDate, setSelectedDate, slots, mode }) {
      const todayStr = new Date().toISOString().split("T")[0];
      return (
        <div style={{background:"rgba(255,255,255,0.88)",borderRadius:18,padding:16,boxShadow:"0 2px 18px rgba(180,120,120,0.10)",marginBottom:16}}>
          {/* ── 月ナビ ── */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <button style={{border:"none",background:"transparent",fontSize:22,color:"#c08080",padding:"0 8px"}}
              onClick={()=>setCalMonth(m=>{const d=new Date(m.year,m.month-1,1);return{year:d.getFullYear(),month:d.getMonth()};})}>‹</button>
            <span style={{fontFamily:"'Noto Serif JP',serif",fontSize:16,fontWeight:600,color:"#6b3a3a"}}>
              {calMonth.year}年 {MONTHS_JA[calMonth.month]}
            </span>
            <button style={{border:"none",background:"transparent",fontSize:22,color:"#c08080",padding:"0 8px"}}
              onClick={()=>setCalMonth(m=>{const d=new Date(m.year,m.month+1,1);return{year:d.getFullYear(),month:d.getMonth()};})}>›</button>
          </div>
          {/* ── 曜日ヘッダ ── */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>
            {["日","月","火","水","木","金","土"].map((d,i)=>(
              <div key={d} style={{textAlign:"center",fontSize:11,padding:"4px 0",fontWeight:700,color:i===0?"#c07070":i===6?"#7090c0":"#7a6e6a"}}>{d}</div>
            ))}
          </div>
          {/* ── 日付グリッド ── */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
            {calDays.map((day,i)=>{
              if(!day) return <div key={i}/>;
              const ds = day.toISOString().split("T")[0];
              const isPast = ds < todayStr;
              const isSelected = ds === selectedDate;
              const isToday = ds === todayStr;
              const daySlots = slots[ds] || [];
              const openCount = daySlots.filter(s=>s.status==="open").length;
              const bookedCount = daySlots.filter(s=>s.status==="booked").length;
              const isSun = day.getDay()===0, isSat = day.getDay()===6;
              const isClosed = !slots[ds]; // 日曜など営業しない日
              return (
                <button key={i} onClick={()=>!isPast&&!isClosed&&setSelectedDate(ds)} disabled={isPast||isClosed}
                  style={{border:"none",
                    background:isSelected?"linear-gradient(135deg,#e8a0a0,#d47a7a)":isToday?"#fde8e8":"transparent",
                    borderRadius:10,padding:"6px 2px",display:"flex",flexDirection:"column",alignItems:"center",
                    minHeight:48,opacity:(isPast||isClosed)?0.3:1,
                    color:isSelected?"#fff":isSun?"#c07070":isSat?"#6a90c0":"#3d3530"}}>
                  <span style={{fontSize:13,fontWeight:500,lineHeight:1.4}}>{day.getDate()}</span>
                  {!isPast && !isClosed && (
                    <span style={{display:"flex",gap:2,marginTop:3}}>
                      {mode==="client"
                        ? Array(Math.min(openCount,3)).fill(0).map((_,j)=>
                            <span key={j} style={{width:5,height:5,borderRadius:"50%",background:isSelected?"rgba(255,255,255,0.8)":"#d47a7a",display:"inline-block"}}/>)
                        : <>
                            {openCount>0&&<span style={{width:5,height:5,borderRadius:"50%",background:isSelected?"rgba(255,255,255,0.8)":"#d47a7a",display:"inline-block"}}/>}
                            {bookedCount>0&&<span style={{width:5,height:5,borderRadius:"50%",background:isSelected?"rgba(255,255,255,0.8)":"#b06060",display:"inline-block"}}/>}
                          </>
                      }
                    </span>
                  )}
                  {isClosed && !isPast && <span style={{fontSize:8,color:"#bbb"}}>休</span>}
                </button>
              );
            })}
          </div>
          {/* ── 凡例 ── */}
          <div style={{fontSize:11,color:"#9a7a7a",marginTop:10,display:"flex",gap:4,alignItems:"center"}}>
            <span style={{width:5,height:5,borderRadius:"50%",background:"#d47a7a",display:"inline-block",marginRight:4}}/>空き有り
            {mode==="stylist"&&<span style={{marginLeft:12,display:"flex",alignItems:"center",gap:4}}><span style={{width:5,height:5,borderRadius:"50%",background:"#b06060",display:"inline-block"}}/>予約済み</span>}
          </div>
        </div>
      );
    }

    // ── モーダル ──────────────────────────────────────
    function Modal({ children, onClose }) {
      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{background:"#fff8f5",borderRadius:"22px 22px 0 0",width:"100%",maxWidth:480,padding:"24px 20px 40px",maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            {children}
          </div>
        </div>
      );
    }

    // ── Toast ──────────────────────────────────────
    function Toast({ msg }) {
      if (!msg) return null;
      return (
        <div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:"#6b3a3a",color:"#fff",borderRadius:30,padding:"10px 28px",fontSize:14,zIndex:200,whiteSpace:"nowrap",boxShadow:"0 4px 16px rgba(0,0,0,0.18)"}}>
          {msg}
        </div>
      );
    }

    // ── メインアプリ ──────────────────────────────────
    function App() {
      const [mode, setMode] = useState("client");
      const [slots, setSlots] = useState(generateSlots);
      const [selectedDate, setSelectedDate] = useState(null);
      const [calMonth, setCalMonth] = useState(()=>{const t=new Date();return{year:t.getFullYear(),month:t.getMonth()};});
      const [modal, setModal] = useState(null);
      const [form, setForm] = useState({name:"",phone:"",note:"",address:""});
      const [toast, setToast] = useState("");
      const [pwModal, setPwModal] = useState(false);
      const [pwInput, setPwInput] = useState("");
      const [pwError, setPwError] = useState(false);
      const [stylistView, setStylistView] = useState("calendar");
      const [clientView, setClientView] = useState("calendar");

      function showToast(msg) { setToast(msg); setTimeout(()=>setToast(""),2600); }

      function buildCalendar(year, month) {
        const first = new Date(year,month,1);
        const last = new Date(year,month+1,0);
        const days = [];
        for(let i=0;i<first.getDay();i++) days.push(null);
        for(let d=1;d<=last.getDate();d++) days.push(new Date(year,month,d));
        return days;
      }

      const calDays = buildCalendar(calMonth.year, calMonth.month);

      // ── パスワード認証 ──
      function handleStylistClick() { setPwInput(""); setPwError(false); setPwModal(true); }
      function handlePwSubmit() {
        if(pwInput===STYLIST_PASSWORD){ setPwModal(false); setMode("stylist"); setSelectedDate(null); setStylistView("calendar"); }
        else { setPwError(true); setPwInput(""); }
      }

      // ── 予約確定（クライアント） ──
      function handleBook() {
        if(!form.name.trim()||!form.phone.trim()||!form.address.trim()) return;
        const {date,slotIdx} = modal;
        setSlots(prev=>{
          const updated={...prev};
          updated[date]=prev[date].map((s,i)=>i===slotIdx?{...s,status:"booked",clientName:form.name,clientPhone:form.phone,clientNote:form.note,address:form.address}:s);
          return updated;
        });
        const bookedInfo = { date, slotIdx, name:form.name, phone:form.phone, address:form.address, note:form.note, time:slots[date][slotIdx].time };
        setModal({ type:"booked", ...bookedInfo });
        setForm({name:"",phone:"",note:"",address:""});
      }

      // ── 予約キャンセル（施術者） ──
      function handleCancel() {
        const {date,slotIdx} = modal;
        setSlots(prev=>{
          const updated={...prev};
          updated[date]=prev[date].map((s,i)=>i===slotIdx?{...s,status:"open",clientName:"",clientPhone:"",clientNote:"",address:""}:s);
          return updated;
        });
        setModal(null);
        showToast("予約をキャンセルしました");
      }

      // ── 選択日のスロット ──
      const daySlots = selectedDate ? (slots[selectedDate]||[]) : [];

      // ═══════════════════════════════════════════════
      //  レンダリング
      // ═══════════════════════════════════════════════
      return (
        <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column"}}>

          {/* ── ヘッダー ── */}
          <div style={{background:"linear-gradient(135deg,#e8b4b8,#c9a0dc)",padding:"20px 20px 16px",boxShadow:"0 2px 12px rgba(180,100,100,0.15)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:22,fontWeight:600,color:"#fff",letterSpacing:2,textShadow:"0 1px 4px rgba(0,0,0,0.15)"}}>
                  ✂ 訪問美容 カット予約
                </div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:3,letterSpacing:1}}>
                  出張カット専門 · 月〜土 10:00〜18:00
                </div>
              </div>
              {mode==="client"
                ? <button onClick={handleStylistClick}
                    style={{background:"rgba(255,255,255,0.25)",border:"1px solid rgba(255,255,255,0.5)",borderRadius:20,padding:"6px 14px",color:"#fff",fontSize:12,backdropFilter:"blur(4px)"}}>
                    施術者
                  </button>
                : <button onClick={()=>{setMode("client");setSelectedDate(null);setClientView("calendar");}}
                    style={{background:"rgba(255,255,255,0.25)",border:"1px solid rgba(255,255,255,0.5)",borderRadius:20,padding:"6px 14px",color:"#fff",fontSize:12}}>
                    ← 戻る
                  </button>
              }
            </div>

            {/* ── タブ（施術者モード） ── */}
            {mode==="stylist" && (
              <div style={{display:"flex",gap:8,marginTop:14}}>
                {[["calendar","カレンダー"],["list","予約一覧"]].map(([v,label])=>(
                  <button key={v} onClick={()=>setStylistView(v)}
                    style={{flex:1,padding:"8px 0",borderRadius:20,border:"none",
                      background:stylistView===v?"#fff":"rgba(255,255,255,0.25)",
                      color:stylistView===v?"#b06080":"#fff",fontSize:13,fontWeight:600}}>
                    {label}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* ── コンテンツ ── */}
          <div style={{flex:1,padding:"16px 16px 80px",overflowY:"auto"}}>

            {/* ══ クライアントモード ══ */}
            {mode==="client" && (
              <>
                {/* メニュー紹介カード */}
                <div style={{background:"linear-gradient(135deg,#fff0f3,#f5e6fb)",borderRadius:16,padding:"16px 18px",marginBottom:16,boxShadow:"0 2px 12px rgba(180,100,180,0.10)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:48,height:48,borderRadius:"50%",background:"linear-gradient(135deg,#e8b4b8,#c9a0dc)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>✂</div>
                    <div>
                      <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:16,fontWeight:600,color:"#6b3060"}}>{MENU.name}</div>
                      <div style={{fontSize:13,color:"#9a6a7a",marginTop:2}}>{MENU.duration} · <span style={{fontWeight:700,color:"#c06080"}}>{MENU.price}</span></div>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:"#a07080",marginTop:10,lineHeight:1.7,borderTop:"1px solid rgba(200,150,180,0.25)",paddingTop:10}}>
                    ご自宅・施設へお伺いしてカットいたします。<br/>
                    シャンプー台がなくても施術可能です。<br/>
                    ご高齢の方・お体の不自由な方も安心してご利用ください。
                  </div>
                </div>

                {/* カレンダー */}
                <Calendar calDays={calDays} calMonth={calMonth} setCalMonth={setCalMonth}
                  selectedDate={selectedDate} setSelectedDate={setSelectedDate} slots={slots} mode="client"/>

                {/* 選択日のスロット */}
                {selectedDate && (
                  <div style={{background:"rgba(255,255,255,0.88)",borderRadius:16,padding:16,boxShadow:"0 2px 12px rgba(180,100,100,0.08)"}}>
                    <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:15,fontWeight:600,color:"#6b3a3a",marginBottom:12}}>
                      {formatDate(selectedDate)} の空き時間
                    </div>
                    {daySlots.length===0
                      ? <div style={{textAlign:"center",color:"#bba0a0",padding:"20px 0",fontSize:13}}>この日は休業日です</div>
                      : daySlots.map((slot,i)=>(
                          <button key={i} disabled={slot.status==="booked"}
                            onClick={()=>setModal({type:"book",date:selectedDate,slotIdx:i})}
                            style={{width:"100%",marginBottom:8,padding:"12px 16px",borderRadius:12,border:"none",
                              background:slot.status==="booked"?"#f0e0e0":"linear-gradient(135deg,#fff0f3,#f5e6fb)",
                              display:"flex",alignItems:"center",justifyContent:"space-between",
                              opacity:slot.status==="booked"?0.6:1,
                              boxShadow:slot.status==="open"?"0 1px 6px rgba(200,100,150,0.12)":"none"}}>
                            <span style={{fontSize:16,fontWeight:700,color:slot.status==="booked"?"#b09090":"#a04060"}}>
                              {slot.time}
                            </span>
                            <span style={{fontSize:12,padding:"4px 12px",borderRadius:20,fontWeight:600,
                              background:slot.status==="booked"?"rgba(180,100,100,0.15)":"linear-gradient(135deg,#e8b4b8,#c9a0dc)",
                              color:slot.status==="booked"?"#b09090":"#fff"}}>
                              {slot.status==="booked"?"予約済み":"予約する →"}
                            </span>
                          </button>
                        ))
                    }
                  </div>
                )}

                {!selectedDate && (
                  <div style={{textAlign:"center",color:"#c0a0a8",fontSize:13,marginTop:20,lineHeight:1.8}}>
                    ✂ ご希望の日付をカレンダーから選んでください<br/>
                    <span style={{fontSize:11}}>● のある日に空き枠があります</span>
                  </div>
                )}
              </>
            )}

            {/* ══ 施術者モード ══ */}
            {mode==="stylist" && (
              <>
                {stylistView==="calendar" && (
                  <>
                    <Calendar calDays={calDays} calMonth={calMonth} setCalMonth={setCalMonth}
                      selectedDate={selectedDate} setSelectedDate={setSelectedDate} slots={slots} mode="stylist"/>

                    {selectedDate && (
                      <div style={{background:"rgba(255,255,255,0.88)",borderRadius:16,padding:16,boxShadow:"0 2px 12px rgba(180,100,100,0.08)"}}>
                        <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:15,fontWeight:600,color:"#6b3a3a",marginBottom:12}}>
                          {formatDate(selectedDate)} のスケジュール
                        </div>
                        {daySlots.map((slot,i)=>(
                          <div key={i}
                            style={{marginBottom:8,padding:"12px 14px",borderRadius:12,
                              background:slot.status==="booked"?"linear-gradient(135deg,#fde8e8,#fce0f0)":"rgba(240,245,240,0.7)",
                              display:"flex",alignItems:"center",justifyContent:"space-between",
                              boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
                            <div>
                              <span style={{fontSize:15,fontWeight:700,color:slot.status==="booked"?"#a04060":"#6a8a6a"}}>{slot.time}</span>
                              {slot.status==="booked"&&(
                                <div style={{fontSize:12,color:"#9a5060",marginTop:3}}>
                                  {slot.clientName}｜{slot.clientPhone}
                                </div>
                              )}
                            </div>
                            {slot.status==="booked"
                              ? <button onClick={()=>setModal({type:"detail",date:selectedDate,slotIdx:i,...slot})}
                                  style={{background:"linear-gradient(135deg,#e8b4b8,#c9a0dc)",border:"none",borderRadius:16,padding:"5px 14px",color:"#fff",fontSize:12,fontWeight:600}}>
                                  詳細
                                </button>
                              : <span style={{fontSize:11,color:"#a0c0a0",padding:"4px 12px",background:"rgba(160,200,160,0.2)",borderRadius:12}}>空き</span>
                            }
                          </div>
                        ))}
                      </div>
                    )}
                    {!selectedDate&&<div style={{textAlign:"center",color:"#c0a0a8",fontSize:13,marginTop:20}}>日付を選択してスケジュールを確認</div>}
                  </>
                )}

                {stylistView==="list" && (
                  <div>
                    <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:15,fontWeight:600,color:"#6b3a3a",marginBottom:12}}>予約一覧</div>
                    {Object.entries(slots).flatMap(([date,daySlots])=>
                      daySlots.filter(s=>s.status==="booked").map((s,i)=>({date,slot:s,idx:i}))
                    ).length===0
                      ? <div style={{textAlign:"center",color:"#c0a0a8",padding:"40px 0",fontSize:13}}>予約はありません</div>
                      : Object.entries(slots).flatMap(([date,daySlots])=>
                          daySlots.map((s,i)=>({date,slot:s,idx:i})).filter(({slot})=>slot.status==="booked")
                        ).map(({date,slot,idx},key)=>(
                          <div key={key}
                            style={{background:"linear-gradient(135deg,#fff0f3,#f5e6fb)",borderRadius:14,padding:"14px 16px",marginBottom:10,
                              boxShadow:"0 1px 8px rgba(180,100,150,0.10)"}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                              <div>
                                <div style={{fontSize:13,color:"#9a6070",marginBottom:4}}>{formatDate(date)} {slot.time}</div>
                                <div style={{fontSize:15,fontWeight:700,color:"#6b3a3a"}}>{slot.clientName}</div>
                                <div style={{fontSize:12,color:"#a07080",marginTop:3}}>📞 {slot.clientPhone}</div>
                                <div style={{fontSize:12,color:"#a07080",marginTop:2}}>📍 {slot.address}</div>
                                {slot.clientNote&&<div style={{fontSize:11,color:"#b09090",marginTop:3}}>メモ：{slot.clientNote}</div>}
                              </div>
                              <button onClick={()=>setModal({type:"detail",date,slotIdx:idx,...slot})}
                                style={{background:"linear-gradient(135deg,#e8b4b8,#c9a0dc)",border:"none",borderRadius:16,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:600,whiteSpace:"nowrap",marginLeft:8}}>
                                詳細
                              </button>
                            </div>
                          </div>
                        ))
                    }
                  </div>
                )}
              </>
            )}
          </div>

          {/* ═══ モーダル類 ═══ */}

          {/* ── パスワード入力モーダル ── */}
          {pwModal && (
            <Modal onClose={()=>setPwModal(false)}>
              <div style={{textAlign:"center",marginBottom:20}}>
                <div style={{fontSize:32,marginBottom:8}}>✂</div>
                <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:18,fontWeight:600,color:"#6b3a3a"}}>施術者ログイン</div>
              </div>
              <input type="password" value={pwInput} onChange={e=>setPwInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handlePwSubmit()}
                placeholder="パスワードを入力"
                style={{width:"100%",padding:"12px 16px",borderRadius:12,border:pwError?"2px solid #e07070":"1px solid #e0c0c0",
                  fontSize:16,marginBottom:8,background:"#fff8f5",outline:"none"}}/>
              {pwError&&<div style={{color:"#c06060",fontSize:12,textAlign:"center",marginBottom:8}}>パスワードが違います</div>}
              <button onClick={handlePwSubmit}
                style={{width:"100%",padding:"13px",borderRadius:12,border:"none",
                  background:"linear-gradient(135deg,#e8b4b8,#c9a0dc)",color:"#fff",fontSize:15,fontWeight:700,
                  boxShadow:"0 3px 12px rgba(180,100,150,0.25)"}}>
                ログイン
              </button>
            </Modal>
          )}

          {/* ── 予約フォームモーダル（クライアント） ── */}
          {modal?.type==="book" && (
            <Modal onClose={()=>setModal(null)}>
              <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:17,fontWeight:600,color:"#6b3a3a",marginBottom:16}}>
                ご予約内容の入力
              </div>

              {/* 日時・メニュー確認 */}
              <div style={{background:"linear-gradient(135deg,#fff0f3,#f5e6fb)",borderRadius:12,padding:"12px 14px",marginBottom:16}}>
                <div style={{fontSize:13,color:"#9a6070"}}>
                  📅 {formatDate(modal.date)} {slots[modal.date][modal.slotIdx].time}<br/>
                  ✂ {MENU.name} · {MENU.duration} · <span style={{fontWeight:700,color:"#c06080"}}>{MENU.price}</span>
                </div>
              </div>

              {/* 入力フォーム */}
              {[
                {key:"name",    label:"お名前 *",   placeholder:"例：山田 花子",    type:"text"},
                {key:"phone",   label:"電話番号 *",  placeholder:"例：090-1234-5678",type:"tel"},
                {key:"address", label:"ご住所 *",    placeholder:"例：○○市△△町1-2-3",type:"text"},
              ].map(({key,label,placeholder,type})=>(
                <div key={key} style={{marginBottom:12}}>
                  <div style={{fontSize:12,color:"#9a7070",marginBottom:4,fontWeight:600}}>{label}</div>
                  <input type={type} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                    placeholder={placeholder}
                    style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid #e0c0c0",
                      fontSize:14,background:"#fff8f5",outline:"none"}}/>
                </div>
              ))}
              <div style={{marginBottom:20}}>
                <div style={{fontSize:12,color:"#9a7070",marginBottom:4,fontWeight:600}}>備考（任意）</div>
                <textarea value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}
                  placeholder="例：毛量が多め、短めにカットしてほしいなど"
                  rows={3}
                  style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid #e0c0c0",
                    fontSize:13,background:"#fff8f5",resize:"none",outline:"none"}}/>
              </div>

              <button onClick={handleBook}
                disabled={!form.name.trim()||!form.phone.trim()||!form.address.trim()}
                style={{width:"100%",padding:"14px",borderRadius:12,border:"none",
                  background:(!form.name.trim()||!form.phone.trim()||!form.address.trim())
                    ?"#e0d0d0":"linear-gradient(135deg,#e8b4b8,#c9a0dc)",
                  color:"#fff",fontSize:15,fontWeight:700,
                  boxShadow:"0 3px 12px rgba(180,100,150,0.25)"}}>
                予約を確定する
              </button>
            </Modal>
          )}

          {/* ── 予約完了モーダル（クライアント） ── */}
          {modal?.type==="booked" && (
            <Modal onClose={()=>{setModal(null);setSelectedDate(null);}}>
              <div style={{textAlign:"center",marginBottom:20}}>
                <div style={{fontSize:44,marginBottom:8}}>✂</div>
                <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:20,fontWeight:600,color:"#6b3a3a"}}>ご予約が完了しました</div>
              </div>
              <div style={{background:"linear-gradient(135deg,#fff0f3,#f5e6fb)",borderRadius:14,padding:"16px",marginBottom:20}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  {[
                    ["日時", `${formatDate(modal.date)} ${modal.time}`],
                    ["メニュー", `${MENU.name} · ${MENU.price}`],
                    ["お名前", modal.name],
                    ["電話番号", modal.phone],
                    ["ご住所", modal.address],
                    modal.note ? ["備考", modal.note] : null,
                  ].filter(Boolean).map(([label,value])=>(
                    <tr key={label}>
                      <td style={{padding:"5px 8px",color:"#9a7070",whiteSpace:"nowrap",fontWeight:600,verticalAlign:"top"}}>{label}</td>
                      <td style={{padding:"5px 8px",color:"#4a2a2a"}}>{value}</td>
                    </tr>
                  ))}
                </table>
              </div>
              <button onClick={()=>sendSMSToStylist(modal.date,modal.time,modal.name,modal.phone,modal.address,modal.note)}
                style={{width:"100%",padding:"13px",borderRadius:12,border:"none",
                  background:"linear-gradient(135deg,#a0c8a0,#70b070)",color:"#fff",fontSize:14,fontWeight:700,marginBottom:10}}>
                📩 施術者にSMSで通知する
              </button>
              <button onClick={()=>{setModal(null);setSelectedDate(null);}}
                style={{width:"100%",padding:"12px",borderRadius:12,border:"1px solid #e0c0c0",
                  background:"transparent",color:"#9a7070",fontSize:14}}>
                閉じる
              </button>
            </Modal>
          )}

          {/* ── 予約詳細モーダル（施術者） ── */}
          {modal?.type==="detail" && (
            <Modal onClose={()=>setModal(null)}>
              <div style={{fontFamily:"'Noto Serif JP',serif",fontSize:17,fontWeight:600,color:"#6b3a3a",marginBottom:16}}>
                予約詳細
              </div>
              <div style={{background:"linear-gradient(135deg,#fff0f3,#f5e6fb)",borderRadius:14,padding:"16px",marginBottom:16}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  {[
                    ["日時",    `${formatDate(modal.date)} ${modal.time}`],
                    ["メニュー",`${MENU.name} · ${MENU.price}`],
                    ["お名前",  modal.clientName],
                    ["電話番号",modal.clientPhone],
                    ["ご住所",  modal.address],
                    modal.clientNote ? ["備考",modal.clientNote] : null,
                  ].filter(Boolean).map(([label,value])=>(
                    <tr key={label}>
                      <td style={{padding:"6px 8px",color:"#9a7070",whiteSpace:"nowrap",fontWeight:600,verticalAlign:"top"}}>{label}</td>
                      <td style={{padding:"6px 8px",color:"#4a2a2a"}}>{value}</td>
                    </tr>
                  ))}
                </table>
              </div>
              <a href={`tel:${modal.clientPhone}`}
                style={{display:"block",width:"100%",padding:"12px",borderRadius:12,border:"none",
                  background:"linear-gradient(135deg,#a0c8e0,#70a0d0)",color:"#fff",fontSize:14,fontWeight:700,
                  textAlign:"center",textDecoration:"none",marginBottom:10}}>
                📞 電話をかける
              </a>
              <button onClick={handleCancel}
                style={{width:"100%",padding:"12px",borderRadius:12,border:"none",
                  background:"linear-gradient(135deg,#e8a0a0,#d47070)",color:"#fff",fontSize:14,fontWeight:700,marginBottom:10}}>
                予約をキャンセルする
              </button>
              <button onClick={()=>setModal(null)}
                style={{width:"100%",padding:"11px",borderRadius:12,border:"1px solid #e0c0c0",
                  background:"transparent",color:"#9a7070",fontSize:14}}>
                閉じる
              </button>
            </Modal>
          )}

          <Toast msg={toast}/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
